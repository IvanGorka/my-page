
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя фотография</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f2f2;
        }

        /* Контейнер фотографии */
        .photo-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }

        /* Фотография */
        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Дата и время */
        #datetime {
            position: absolute;

            /* Положение даты */
            bottom: 20px;
            right: 20px;

            /* Внешний вид */
            color: white;
            font-size: 24px;
            font-family: Arial, sans-serif;
            font-weight: bold;

            /* Тень для читаемости */
            text-shadow: 2px 2px 4px black;

            white-space: nowrap;
        }
    </style>
</head>

<body>

    <div class="photo-container">

        <img src="chek.jpg" alt="Фотография">

        <div id="datetime"></div>

    </div>

    <script>
        // Фиксируем время один раз при создании страницы
        const visitTime = new Date();

        function setDateTime() {
            const day = String(visitTime.getDate()).padStart(2, '0');
            const month = String(visitTime.getMonth() + 1).padStart(2, '0');
            const year = visitTime.getFullYear();

            const hours = String(visitTime.getHours()).padStart(2, '0');
            const minutes = String(visitTime.getMinutes()).padStart(2, '0');
            const seconds = String(visitTime.getSeconds()).padStart(2, '0');

            const dateTime = `${day}.${month}.${year} ${hours}:${minutes}:${seconds}`;

            document.getElementById('datetime').textContent = dateTime;
        }

        // Отображаем время только один раз
        setDateTime();
    </script>

</body>
</html>
