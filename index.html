
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя фотография</title>

    <link rel="stylesheet" href="https://mathfonts.github.io/NotoSans/mathfonts.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f2f2;
        }

        /* Контейнер фотографии */
        .photo-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }

        /* Фотография */
        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Дата и время */
        #datetime {
            position: absolute;

            /* Положение даты */
            top: 243px;
            right: 387px;

            /* Внешний вид */
            color: #A6A6A6;
            font-size: 17px;
            font-family: "Noto Sans Math", sans-serif;
            font-weight: normal;

            white-space: nowrap;
            z-index: 10;
        }

        /* Обычный ноль без точки */
        .plain-zero {
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>

    <div class="photo-container">
        <img src="chek.jpg" alt="Фотография">
        <div id="datetime"></div>
    </div>

    <script>
        // Фиксируем время один раз при открытии страницы
        const visitTime = new Date();

        function setDateTime() {
            const day = String(visitTime.getDate()).padStart(2, '0');
            const month = String(visitTime.getMonth() + 1).padStart(2, '0');
            const year = visitTime.getFullYear();

            const hours = String(visitTime.getHours()).padStart(2, '0');
            const minutes = String(visitTime.getMinutes()).padStart(2, '0');
            const seconds = String(visitTime.getSeconds()).padStart(2, '0');

            const dateTime = `${day}.${month}.${year} ${hours}:${minutes}:${seconds}`;

            // Преобразуем цифры в нужный стиль
            const styledDate = dateTime.replace(/[0-9]/g, digit => {

                // Ноль отображаем обычным шрифтом
                if (digit === '0') {
                    return '<span class="plain-zero">0</span>';
                }

                // Остальные цифры оставляем в математическом стиле
                return String.fromCodePoint(
                    0x1D7F6 + Number(digit)
                );
            });

            document.getElementById('datetime').innerHTML = styledDate;
        }

        // Отображаем время только один раз
        setDateTime();
    </script>

</body>
</html>
