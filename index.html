
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя фотография</title>

    <link rel="stylesheet" href="https://mathfonts.github.io/NotoSans/mathfonts.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f2f2;
        }

        .photo-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        #datetime {
            position: absolute;

            top: 266px;
            right: 385px;

            color: #A6A6A6;
            font-size: 18px;
            font-family: "Noto Sans Math", sans-serif;
            font-weight: normal;

            white-space: nowrap;
            z-index: 10;
        }
    </style>
</head>

<body>

    <div class="photo-container">
        <img src="chek.jpg" alt="Фотография">
        <div id="datetime"></div>
    </div>

    <script>
        // Фиксируем время один раз при открытии страницы
        const visitTime = new Date();

        function setDateTime() {
            const day = String(visitTime.getDate()).padStart(2, '0');
            const month = String(visitTime.getMonth() + 1).padStart(2, '0');
            const year = visitTime.getFullYear();

            const hours = String(visitTime.getHours()).padStart(2, '0');
            const minutes = String(visitTime.getMinutes()).padStart(2, '0');
            const seconds = String(visitTime.getSeconds()).padStart(2, '0');

            const dateTime = `${day}.${month}.${year} ${hours}:${minutes}:${seconds}`;

            // Моноширинные математические цифры
            const styledDate = dateTime.replace(/[0-9]/g, digit =>
                String.fromCodePoint(0x1D7F6 + Number(digit))
            );

            document.getElementById('datetime').textContent = styledDate;
        }

        setDateTime();
    </script>

</body>
</html>
